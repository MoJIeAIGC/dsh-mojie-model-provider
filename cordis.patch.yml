# Bundle layer installed by `dsh plugin add`.
#
# This inserts the Mojie provider row under the settings namespace `mojie`.
# The API key is a credential reference: keep MOJIE_API_KEY in the launching
# environment, or store it under that reference through the Models page card.
# A profile's own cordis.patch.yml can override this row by id.
- insert:
    - id: mojie
      name: '@mojieai/dsh-mojie-model-provider'
      config:
        apiKeyEnv: MOJIE_API_KEY
        baseURL: 'https://mojieaigc.com'
        # Empty means: inherit /v1/models discovery plus the built-in catalog.
        # The Models page card fills this list for you (model rows, context
        # windows, input types, and thinking levels); hand-written entries here
        # still win and pin the values. Thinking levels come from the per-vendor
        # recommendation unless a row pins `reasoningEfforts`, and
        # `reasoning: 'off'` declares a model that cannot think at all.
        models: []
        # Send `reasoning.effort` for every model that does not opt out, even
        # though the site publishes no effort vocabulary. Set false to stop.
        reasoningDefaults: true
